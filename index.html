<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Viaje de la Nave Brillante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow-yellow: #FFD65C;
      --glow-cyan: #5CE1E6;
      --coral: #FF6B6B;
      --mint: #6FE0BE;
      --lilac: #B79CFF;
      --navy: #0F1A3D;
      --white: #FFFFFF;
      --skin: #FFD8B0;
      --hair: #7A4B30;
      --pants: #33417A;
      --shoe: #22284A;
      --vein: #E8879D;
      --veinlight: #F5B8C6;
      --tunnel: #3A1030;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: #05070F;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .stage { position: relative; width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .screen {
      position: relative;
      width: min(1100px, 96vw, 150vh);
      aspect-ratio: 8 / 5;
      max-height: 94vh;
      background: #0B1440;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      cursor: pointer;
      border: 6px solid #1A1A1A;
    }
    @media (min-width: 700px) {
      .screen { border-radius: 22px; box-shadow: 0 12px 0 rgba(0,0,0,0.35), 0 20px 50px rgba(0,0,0,0.5); }
      .stage { padding: 14px; }
    }

    .stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .star { position: absolute; background: white; border-radius: 50%; opacity: 0.6; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:.2;} 50%{opacity:.9;} }

    .deco { position: absolute; pointer-events: none; z-index: 1; }
    .planet { border-radius: 50%; opacity: 0.5; animation: floaty 6s ease-in-out infinite; }
    .ring { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); transform: rotate(-20deg); }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .top-chrome {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: space-between; z-index: 40;
    }
    .label-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .scene-label {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12px;
      letter-spacing: 0.06em; color: var(--navy); background: var(--glow-yellow);
      padding: 6px 14px; border-radius: 999px; text-transform: uppercase; box-shadow: 0 3px 0 #C99A1F;
    }
    .player-badge {
      display: none;
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12px;
      color: var(--white); background: rgba(255,255,255,0.14);
      border: 2px solid rgba(255,255,255,0.35);
      padding: 5px 12px; border-radius: 999px;
    }
    .player-badge.show { display: inline-flex; align-items: center; gap: 4px; }
    .sound-toggle {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.3); color: var(--white); font-size: 15px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .sound-toggle.muted { opacity: 0.5; }

    .viz { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; padding: 6% 3% 24%; }

    .stage-visual { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
    .stage-visual.active { display: flex; }
    .stage-visual svg { display: block; width: 100%; height: 100%; overflow: visible; margin: 0 auto; }
    #stageA svg { max-width: 460px; }
    #stageB svg { max-width: 600px; }

    .stage-c-full {
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 0;
    }
    .stage-c-full svg { width: 100%; height: 100%; max-width: none; overflow: hidden; }

    .cell-float, .cell-float-fg {
      animation: cellDrift 7s ease-in-out infinite;
    }
    @keyframes cellDrift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-22px, 14px) scale(1.04); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .intro-astro {
      position: absolute;
      left: 50%;
      top: -320px;
      width: min(340px, 55vw);
      transform: translateX(-50%);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
    }
    .intro-astro img { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.4)); }
    .intro-astro.drop { animation: dropIn 1.3s cubic-bezier(.25,1,.4,1) forwards; }
    @keyframes dropIn {
      0% { top: -320px; opacity: 0; }
      65% { opacity: 1; }
      85% { top: 20%; }
      100% { top: 16%; opacity: 1; }
    }

    #stageA.gender-boy .girl-only { display: none; }
    #stageA.gender-girl .boy-only { display: none; }

    .injection-marker { fill: var(--coral); opacity: 0; transition: opacity 0.4s; }
    .injection-marker.show { opacity: 1; }
    .injection-pulse { fill: none; stroke: var(--coral); stroke-width: 2; opacity: 0; }
    .injection-pulse.pulse { opacity: 1; animation: ringPulse 1.2s ease-out infinite; }
    @keyframes ringPulse { 0% { r: 5; opacity: 0.9; } 100% { r: 22; opacity: 0; } }

    .glow-core { fill: var(--glow-yellow); opacity: 0; filter: blur(2px); }
    .glow-core.active { animation: coreGlow 1.6s ease-in-out infinite; }
    @keyframes coreGlow { 0%,100% { r: 12; opacity: 0.55; } 50% { r: 20; opacity: 0.95; } }
    .body-shine { fill: url(#shineGradient); opacity: 0; transition: opacity 1s ease; }
    .body-shine.on { opacity: 0.85; }

    .camera { opacity: 0; transform: translateY(-14px); transition: opacity 0.6s, transform 0.6s; }
    .camera.show { opacity: 1; transform: translateY(0); }
    .scan-beam { fill: rgba(255, 214, 92, 0.18); opacity: 0; }
    .scan-beam.on { animation: beamSweep 1.8s ease-in-out; }
    @keyframes beamSweep { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    .flash { fill: white; opacity: 0; }
    .flash.on { animation: flashPop 0.5s ease-out; }
    @keyframes flashPop { 0% { opacity: 0; } 15% { opacity: 0.85; } 100% { opacity: 0; } }

    .idle-float { animation: idleBob 3s ease-in-out infinite; }
    @keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .ship-emoji { font-size: 28px; }

    /* ---- Stage B: injection close-up ---- */
    .sparkle { opacity: 0; }
    .sparkle.burst { animation: sparklePop 0.7s ease-out; }
    @keyframes sparklePop {
      0% { opacity: 0; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.6); }
    }
    .ship-b { opacity: 0; transition: opacity 0.3s; }
    .ship-b.visible { opacity: 1; }

    /* ---- Stage C: vein tunnel ---- */
    .blood-cell { animation: cellBob 2.4s ease-in-out infinite; }
    @keyframes cellBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .speed-line {
      stroke: rgba(255,255,255,0.35);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0;
    }
    .speed-line.on { animation: speedFlow 1.1s linear infinite; }
    @keyframes speedFlow {
      0% { opacity: 0; transform: translateX(40px); }
      30% { opacity: 0.8; }
      100% { opacity: 0; transform: translateX(-460px); }
    }
    .ship-c { opacity: 0; transition: opacity 0.3s; filter: drop-shadow(0 0 10px rgba(92,225,230,0.6)); }
    .ship-c.visible { opacity: 1; }
    .trail-c {
      fill: none; stroke: var(--glow-cyan); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 1000; stroke-dashoffset: 1000; opacity: 0.85;
      filter: drop-shadow(0 0 6px rgba(92,225,230,0.7));
    }
    .trail-c.draw { animation: drawTrailC 3.2s ease-in-out forwards; }
    @keyframes drawTrailC { to { stroke-dashoffset: 0; } }

    /* ---- subtitle bar ---- */
    .subtitle-bar {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30;
      display: flex; align-items: flex-end; gap: 0;
      max-width: 90%;
    }
    .mascot-stand {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bubble-classic {
      position: relative;
      background: var(--white);
      border: 3px solid #1A1A1A;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: -6px;
      max-width: min(280px, 62vw);
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .bubble-classic::after {
      content: "";
      position: absolute;
      left: 30px;
      bottom: -12px;
      width: 0; height: 0;
      border-style: solid;
      border-width: 13px 11px 0 0;
      border-color: #1A1A1A transparent transparent transparent;
    }
    .bubble-classic::before {
      content: "";
      position: absolute;
      left: 34px;
      bottom: -7px;
      width: 0; height: 0;
      border-style: solid;
      border-width: 9px 8px 0 0;
      border-color: var(--white) transparent transparent transparent;
      z-index: 1;
    }
    .mascot {
      display: block;
      animation: bob 2.6s ease-in-out infinite;
    }
    .mascot img {
      width: 66px;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
    .sub-name {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 10px; color: var(--navy);
      letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; opacity: 0.55;
    }
    .caption {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: clamp(13px, 1.8vw, 16px);
      color: var(--navy); line-height: 1.32; animation: textIn 0.3s ease;
    }
    @keyframes textIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .dots-row { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); z-index: 30; }
    .progress-dots { display: flex; gap: 7px; }
    .progress-dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid #1A1A1A; transition: background 0.3s, transform 0.3s; }
    .progress-dots span.active { background: var(--glow-yellow); transform: scale(1.25); }

    .tap-hint {
      position: absolute; right: 22px; bottom: 26px; z-index: 35;
      display: flex; align-items: center; gap: 6px;
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; color: var(--navy);
      background: var(--glow-yellow); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 0 #C99A1F;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .tap-hint.show { opacity: 1; animation: tapPulse 1.3s ease-in-out infinite; }
    @keyframes tapPulse { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.05); } }

    .reward-star {
      position: absolute; left: 50%; top: 14%; transform: translate(-50%, -50%) scale(0);
      z-index: 40; font-size: 64px; line-height: 1; pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 214, 64, 0.8));
      opacity: 0; transition: opacity 0.3s;
    }
    .reward-star.show {
      opacity: 1;
      animation: starPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, starFloat 2.4s ease-in-out 0.6s infinite;
    }
    @keyframes starPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
      70% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }
    @keyframes starFloat {
      0%, 100% { transform: translate(-50%, -50%) scale(1) translateY(0); }
      50% { transform: translate(-50%, -50%) scale(1) translateY(-8px); }
    }

    .start-overlay {
      position: absolute; inset: 0; z-index: 50;
      background: radial-gradient(ellipse at 50% 40%, #24357D 0%, #0B1440 60%, #060B26 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px; transition: opacity 0.5s, visibility 0.5s;
    }
    .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .start-title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(26px, 5vw, 36px); color: var(--white); margin-bottom: 10px; }
    .start-sub { font-weight: 700; color: var(--glow-cyan); font-size: 15px; margin-bottom: 26px; }
    .start-rocket { width: 130px; margin: 0 auto 18px; animation: bob 2.6s ease-in-out infinite; }
    .start-rocket img { display: block; width: 100%; height: auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35)); }
    .start-hint {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: var(--navy);
      background: var(--glow-yellow); padding: 10px 22px; border-radius: 999px; box-shadow: 0 4px 0 #C99A1F;
      animation: tapPulse 1.3s ease-in-out infinite;
    }

    .name-step { display: flex; flex-direction: column; align-items: center; }
    .name-label {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--white);
      font-size: clamp(18px, 3.4vw, 24px); margin-bottom: 18px;
    }
    .name-input {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; text-align: center;
      color: var(--navy); background: var(--white); border: none; border-radius: 14px;
      padding: 14px 18px; width: min(260px, 70vw); box-shadow: 0 5px 0 rgba(0,0,0,0.2);
      margin-bottom: 16px;
    }
    .name-input:focus { outline: 3px solid var(--glow-cyan); }
    .gender-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .gender-btn {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; color: var(--white);
      background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.35);
      border-radius: 14px; padding: 10px 18px; cursor: pointer; transition: all 0.15s;
    }
    .gender-btn.selected {
      background: var(--glow-yellow); color: var(--navy); border-color: #1A1A1A;
      box-shadow: 0 4px 0 #C99A1F; transform: translateY(-1px);
    }
    .name-submit {
      font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: var(--navy);
      background: var(--glow-yellow); border: none; border-radius: 999px; padding: 12px 26px;
      box-shadow: 0 5px 0 #C99A1F; cursor: pointer;
    }
    .name-submit:active { transform: translateY(3px); box-shadow: 0 2px 0 #C99A1F; }
    .intro-step { display: none; flex-direction: column; align-items: center; }
    .intro-step.show { display: flex; }

    @media (prefers-reduced-motion: reduce) {
      .trail-c.draw, .glow-core.active, .scan-beam.on, .flash.on, .mascot, .planet, .tap-hint.show,
      .start-rocket, .start-hint, .idle-float, .blood-cell, .speed-line.on, .sparkle.burst { animation: none !important; }
    }
  </style>
  </head>
  <body>

  <div class="stage">
    <div class="screen" id="screen">

      <div class="intro-astro" id="introAstro"><img id="introAstroImg" alt="" /></div>

      <div class="top-chrome">
        <div class="label-group">
          <span class="scene-label" id="sceneLabel">EPISODIO 1</span>
          <span class="player-badge" id="playerBadge">🧑‍🚀 <span id="playerBadgeName"></span></span>
        </div>
        <div class="sound-toggle muted" id="soundBtn" title="Sonido">🔇</div>
      </div>

      <div class="viz">

        <div class="stage-visual gender-boy" id="stageA">
          <svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="shineGradient" cx="50%" cy="45%" r="55%">
                <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#FFD65C" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <ellipse class="body-shine" id="bodyShine" cx="150" cy="175" rx="100" ry="135"/>

            <path d="M130,222 Q122,262 119,302" stroke="#1A1A1A" stroke-width="30" fill="none" stroke-linecap="round"/>
            <path d="M130,222 Q122,262 119,302" stroke="var(--pants)" stroke-width="24" fill="none" stroke-linecap="round"/>
            <path d="M170,222 Q178,262 181,302" stroke="#1A1A1A" stroke-width="30" fill="none" stroke-linecap="round"/>
            <path d="M170,222 Q178,262 181,302" stroke="var(--pants)" stroke-width="24" fill="none" stroke-linecap="round"/>
            <ellipse cx="115" cy="307" rx="18" ry="10" fill="var(--shoe)" stroke="#1A1A1A" stroke-width="3"/>
            <ellipse cx="185" cy="307" rx="18" ry="10" fill="var(--shoe)" stroke="#1A1A1A" stroke-width="3"/>

            <path d="M118,140 Q88,158 76,196" stroke="#1A1A1A" stroke-width="28" fill="none" stroke-linecap="round"/>
            <path d="M118,140 Q88,158 76,196" stroke="var(--skin)" stroke-width="22" fill="none" stroke-linecap="round"/>
            <path id="rightArmPath" d="M182,140 Q212,158 224,196" stroke="#1A1A1A" stroke-width="28" fill="none" stroke-linecap="round"/>
            <path d="M182,140 Q212,158 224,196" stroke="var(--skin)" stroke-width="22" fill="none" stroke-linecap="round"/>
            <circle cx="76" cy="196" r="14" fill="var(--skin)" stroke="#1A1A1A" stroke-width="3"/>
            <circle cx="224" cy="196" r="14" fill="var(--skin)" stroke="#1A1A1A" stroke-width="3"/>

            <g class="boy-only">
              <rect x="106" y="132" width="88" height="98" rx="32" fill="var(--mint)" stroke="#1A1A1A" stroke-width="4"/>
              <path d="M150,158 L154,169 L166,169 L156,176 L160,188 L150,180 L140,188 L144,176 L134,169 L146,169 Z" fill="var(--glow-yellow)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <g class="girl-only">
              <path d="M116,132 L184,132 L208,226 Q150,244 92,226 Z" fill="var(--coral)" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
              <circle cx="128" cy="168" r="4.5" fill="#FFFFFF" opacity="0.85"/>
              <circle cx="170" cy="182" r="4.5" fill="#FFFFFF" opacity="0.85"/>
              <circle cx="144" cy="202" r="4.5" fill="#FFFFFF" opacity="0.85"/>
              <circle cx="178" cy="152" r="4.5" fill="#FFFFFF" opacity="0.85"/>
              <circle cx="120" cy="150" r="4.5" fill="#FFFFFF" opacity="0.85"/>
            </g>

            <circle class="glow-core" id="glowCore" cx="150" cy="178" r="13"/>

            <g class="boy-only">
              <path d="M110,60 Q118,22 150,30 Q182,22 190,60 Q172,42 150,46 Q128,42 110,60 Z" fill="var(--hair)" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
              <path d="M136,28 L140,10 L147,30 Z" fill="var(--hair)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
              <path d="M159,29 L165,9 L171,29 Z" fill="var(--hair)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
            </g>
            <g class="girl-only">
              <ellipse cx="150" cy="66" rx="48" ry="31" fill="var(--hair)" stroke="#1A1A1A" stroke-width="4"/>
              <circle cx="100" cy="92" r="20" fill="var(--hair)" stroke="#1A1A1A" stroke-width="4"/>
              <circle cx="200" cy="92" r="20" fill="var(--hair)" stroke="#1A1A1A" stroke-width="4"/>
              <path d="M92,76 L106,76 L99,88 Z" fill="var(--coral)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
              <path d="M194,76 L208,76 L201,88 Z" fill="var(--coral)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
            </g>

            <circle cx="150" cy="82" r="40" fill="var(--skin)" stroke="#1A1A1A" stroke-width="4"/>
            <circle cx="137" cy="84" r="4.5" fill="var(--navy)"/>
            <circle cx="163" cy="84" r="4.5" fill="var(--navy)"/>
            <ellipse cx="124" cy="97" rx="7.5" ry="4.5" fill="var(--coral)" opacity="0.5"/>
            <ellipse cx="176" cy="97" rx="7.5" ry="4.5" fill="var(--coral)" opacity="0.5"/>
            <path d="M135 99 Q150 110 165 99" stroke="var(--navy)" stroke-width="3.2" fill="none" stroke-linecap="round"/>

            <circle class="injection-marker" id="injMarkerA" cx="216" cy="184" r="5"/>
            <circle class="injection-pulse" id="injPulseA" cx="216" cy="184" r="5"/>

            <image class="idle-float" id="shipIdle" href="" x="205" y="20" width="60" height="60" style="display:none;" />

            <g class="camera" id="camera">
              <rect x="70" y="4" width="160" height="30" rx="10" fill="#0F1A3D" stroke="#1A1A1A" stroke-width="3"/>
              <circle cx="150" cy="19" r="9" fill="#5CE1E6" stroke="#1A1A1A" stroke-width="2"/>
              <polygon class="scan-beam" id="scanBeam" points="120,34 180,34 226,215 74,215" />
            </g>
            <rect class="flash" id="flash" x="0" y="0" width="300" height="420" />
          </svg>
        </div>

        <div class="stage-visual" id="stageB">

RERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERET00Pr/Ay0H20GigqPbAAAAAElFTkSuQmCC",
  };

  const el = {
    screen: document.getElementById('screen'),
    label: document.getElementById('sceneLabel'),
    caption: document.getElementById('caption'),
    dots: document.getElementById('dots'),
    mascotIcon: document.getElementById('mascotIcon'),
    mascotImg: document.getElementById('mascotImg'),
    soundBtn: document.getElementById('soundBtn'),
    tapHint: document.getElementById('tapHint'),
    rewardStar: document.getElementById('rewardStar'),
    startOverlay: document.getElementById('startOverlay'),
    nameStep: document.getElementById('nameStep'),
    nameInput: document.getElementById('nameInput'),
    nameSubmit: document.getElementById('nameSubmit'),
    introStep: document.getElementById('introStep'),
    introTitle: document.getElementById('introTitle'),
    playerBadge: document.getElementById('playerBadge'),
    playerBadgeName: document.getElementById('playerBadgeName'),

    stageA: document.getElementById('stageA'),
    stageB: document.getElementById('stageB'),
    stageC: document.getElementById('stageC'),

    glowCore: document.getElementById('glowCore'),
    bodyShine: document.getElementById('bodyShine'),
    injMarkerA: document.getElementById('injMarkerA'),
    injPulseA: document.getElementById('injPulseA'),
    camera: document.getElementById('camera'),
    scanBeam: document.getElementById('scanBeam'),
    flash: document.getElementById('flash'),
    shipIdle: document.getElementById('shipIdle'),
    veinBg: document.getElementById('veinBg'),
    introAstro: document.getElementById('introAstro'),
    introAstroImg: document.getElementById('introAstroImg'),

    diveRoute: document.getElementById('diveRoute'),
    shipB: document.getElementById('shipB'),
    sparkleB: document.getElementById('sparkleB'),
    injMarkerB: document.getElementById('injMarkerB'),
    injPulseB: document.getElementById('injPulseB'),

    tunnelRoute: document.getElementById('tunnelRoute'),
    trailC: document.getElementById('trailC'),
    shipC: document.getElementById('shipC'),
    speedLines: document.querySelectorAll('.speed-line'),
  };

  function flyAlong(shipEl, routeEl, durationMs, onDone) {
    const len = routeEl.getTotalLength();
    const startTime = performance.now();
    function step(now) {
      const t = Math.min((now - startTime) / durationMs, 1);
      const pt = routeEl.getPointAtLength(len * t);
      shipEl.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }
  function placeAlong(shipEl, routeEl, fraction) {
    const len = routeEl.getTotalLength();
    const pt = routeEl.getPointAtLength(len * fraction);
    shipEl.setAttribute('transform', `translate(${pt.x},${pt.y})`);
  }

  function setImgHref(elm, src) {
    elm.setAttribute('href', src);
    elm.setAttributeNS('http://www.w3.org/1999/xlink', 'href', src);
  }
  setImgHref(el.shipIdle, ASSETS.astroRocket);
  setImgHref(el.shipB, ASSETS.astroRocket);
  setImgHref(el.shipC, ASSETS.astroRocket);
  setImgHref(el.veinBg, ASSETS.veinCells);
  el.introAstroImg.src = ASSETS.astroSitting;
  document.getElementById('startRocketImg1').src = ASSETS.astroRocket;
  document.getElementById('startRocketImg2').src = ASSETS.astroRocket;

  let scene = 0;
  let canAdvance = true;
  let started = false;
  const TOTAL = 5;

  let soundOn = false;
  function speak(text) {
    if (!soundOn) return;
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'es-CL';
    utter.rate = 0.95;
    utter.pitch = 1.15;
    window.speechSynthesis.speak(utter);
  }
  el.soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    el.soundBtn.textContent = soundOn ? '🔊' : '🔇';
    el.soundBtn.classList.toggle('muted', !soundOn);
    if (soundOn) speak(scenes[scene].caption);
    else window.speechSynthesis && window.speechSynthesis.cancel();
  });

  function renderDots() {
    el.dots.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      const s = document.createElement('span');
      if (i === scene) s.classList.add('active');
      el.dots.appendChild(s);
    }
  }

  function showStage(id) {
    [el.stageA, el.stageB, el.stageC].forEach(s => s.classList.toggle('active', s.id === id));
  }

  function resetVisuals() {
    el.glowCore.classList.remove('active');
    el.bodyShine.classList.remove('on');
    el.camera.classList.remove('show');
    el.scanBeam.classList.remove('on');
    el.flash.classList.remove('on');
    el.shipIdle.style.display = 'none';
    el.injMarkerA.classList.remove('show');
    el.injPulseA.classList.remove('pulse');
    el.rewardStar.classList.remove('show');

    el.shipB.classList.remove('visible');
    el.sparkleB.classList.remove('burst');
    el.injPulseB.classList.remove('pulse');

    el.shipC.classList.remove('visible');
    el.trailC.classList.remove('draw');
    el.trailC.style.strokeDashoffset = 1000;
    el.speedLines.forEach(l => l.classList.remove('on'));

    el.introAstro.classList.remove('drop');
    el.introAstro.style.opacity = '0';
  }

  function showTapHint() { el.tapHint.classList.add('show'); }
  function hideTapHint() { el.tapHint.classList.remove('show'); }

  let childName = '';

  function interpolate(text) {
    const name = childName || 'héroe';
    return text.replace(/\{name\}/g, name);
  }

  const mascotByScene = [ASSETS.astroSitting, ASSETS.astroSitting, ASSETS.astroSitting, ASSETS.astroSitting, ASSETS.astroFlag];

  const scenes = [
    {
      label: 'EPISODIO 1 · LA MISIÓN',
      caption: '¡Hola, {name}! Soy Nova. Hoy vamos a hacer un viaje increíble dentro de tu cuerpo.',
      setup: () => {
        showStage(null);
        requestAnimationFrame(() => {
          el.introAstro.style.opacity = '1';
          el.introAstro.classList.add('drop');
        });
        showTapHint();
      },
    },
    {
      label: 'EPISODIO 2 · ACERCÁNDONOS',
      caption: 'Miremos de cerca, {name}: la nave entra por tu brazo con un pinchazo cortito.',
      setup: () => {
        showStage('stageB');
        placeAlong(el.shipB, el.diveRoute, 0);
        el.shipB.classList.add('visible');
        canAdvance = false;
        hideTapHint();
        setTimeout(() => {
          flyAlong(el.shipB, el.diveRoute, 1400, () => {
            el.sparkleB.classList.add('burst');
            canAdvance = true;
            showTapHint();
          });
        }, 500);
      },
    },
    {
      label: 'EPISODIO 3 · NADANDO POR TUS VENAS',
      caption: '¡Vamos nadando por tus ríos internos, {name}! Mira a tus amigos glóbulos rojos.',
      setup: () => {
        showStage('stageC');
        el.trailC.classList.add('draw');
        el.speedLines.forEach(l => l.classList.add('on'));
        placeAlong(el.shipC, el.tunnelRoute, 0);
        el.shipC.classList.add('visible');
        canAdvance = false;
        hideTapHint();
        flyAlong(el.shipC, el.tunnelRoute, 3800, () => {
          canAdvance = true;
          showTapHint();
        });
      },
    },
    {
      label: 'EPISODIO 4 · A BRILLAR',
      caption: '¡Llegamos, {name}! Ahora esa parte de tu cuerpo brilla suavecito por dentro.',
      setup: () => {
        showStage('stageA');
        el.injMarkerA.classList.add('show');
        el.glowCore.classList.add('active');
        el.bodyShine.classList.add('on');
        showTapHint();
      },
    },
    {
      label: 'EPISODIO 5 · LA FOTO ESPECIAL',
      caption: 'Una cámara gigante toma una foto de tu brillo. Solo debes quedarte quietito. ¡Lo lograste, {name}!',
      setup: () => {
        showStage('stageA');
        el.injMarkerA.classList.add('show');
        el.glowCore.classList.add('active');
        el.bodyShine.classList.add('on');
        el.camera.classList.add('show');
        canAdvance = false;
        hideTapHint();
        setTimeout(() => { el.scanBeam.classList.add('on'); }, 500);
        setTimeout(() => { el.flash.classList.add('on'); }, 1900);
        setTimeout(() => {
          canAdvance = true;
          el.tapHint.textContent = '🔁 Toca para repetir';
          showTapHint();
          el.rewardStar.classList.add('show');
          el.caption.textContent = interpolate('¡Ganaste tu estrella de valentía, {name}! ⭐');
        }, 2500);
      },
    },
  ];

  function render() {
    resetVisuals();
    el.tapHint.textContent = '👉 Toca para seguir';
    const s = scenes[scene];
    const text = interpolate(s.caption);
    el.label.textContent = s.label;
    el.caption.textContent = text;
    el.mascotImg.src = mascotByScene[scene];
    renderDots();
    requestAnimationFrame(() => s.setup());
    speak(text);
  }

  let childGender = 'boy';

  function submitName() {
    const raw = el.nameInput.value.trim();
    childName = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : '';
    el.introTitle.textContent = childName ? `La Misión de ${childName}` : 'La Misión de Héroe';
    if (childName) {
      el.playerBadgeName.textContent = childName;
      el.playerBadge.classList.add('show');
    }
    el.stageA.classList.remove('gender-boy', 'gender-girl');
    el.stageA.classList.add(childGender === 'girl' ? 'gender-girl' : 'gender-boy');
    el.nameStep.style.display = 'none';
    el.introStep.classList.add('show');
  }

  const genderBoyBtn = document.getElementById('genderBoyBtn');
  const genderGirlBtn = document.getElementById('genderGirlBtn');

  genderBoyBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    childGender = 'boy';
    genderBoyBtn.classList.add('selected');
    genderGirlBtn.classList.remove('selected');
  });

  genderGirlBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    childGender = 'girl';
    genderGirlBtn.classList.add('selected');
    genderBoyBtn.classList.remove('selected');
  });

  el.nameSubmit.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    submitName();
  });
  el.nameInput.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
  });
  el.nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitName();
    }
  });

  el.screen.addEventListener('click', () => {
    if (!started) {
      if (!el.introStep.classList.contains('show')) return; 
      started = true;
      el.startOverlay.classList.add('hidden');
      render();
      return;
    }
    if (!canAdvance) return;
    scene = (scene === TOTAL - 1) ? 0 : scene + 1;
    render();
  });

  el.screen.style.backgroundImage = `url(${ASSETS.spaceBg})`;
  setTimeout(() => el.nameInput.focus(), 300);
  </script>
